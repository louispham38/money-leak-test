<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu — MoneyLeakTest</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dashboard-body">
  <div class="container" style="max-width:420px;margin:60px auto;padding:0 16px">
    <a href="index.html" class="logo" style="margin-bottom:24px;display:inline-flex">
      <span class="logo-icon">💧</span><span>MoneyLeakTest</span>
    </a>
    <div class="dash-card">
      <h2 style="margin-bottom:8px">Đặt lại mật khẩu</h2>
      <p id="reset-intro" style="color:var(--text-muted);font-size:0.9rem;margin-bottom:20px">Nhập mật khẩu mới cho tài khoản của bạn.</p>
      <form id="reset-form" class="auth-form">
        <label>Mật khẩu mới<input type="password" id="reset-password" required minlength="6" autocomplete="new-password" /></label>
        <label>Nhập lại mật khẩu<input type="password" id="reset-password2" required minlength="6" autocomplete="new-password" /></label>
        <p id="reset-error" class="auth-error"></p>
        <p id="reset-success" class="auth-success"></p>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Lưu mật khẩu mới</button>
      </form>
      <p id="reset-invalid" hidden style="color:var(--danger)">Link không hợp lệ hoặc đã hết hạn. <a href="index.html">Yêu cầu link mới</a></p>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
